services:
  db:
    image: postgres:16
    container_name: ougc-db
    environment:
      POSTGRES_USER: ougc
      POSTGRES_PASSWORD: ougc
      POSTGRES_DB: ougc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: ougc-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ougc:ougc@db:5432/ougc?sslmode=disable
      JWT_SECRET: supersecret
      DB_AUTO_MIGRATE: "true"
      DB_SEED: "true"

volumes:
  pgdata:
