version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: ougc-postgres
    environment:
      POSTGRES_DB: ougreencampus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: ougc-api
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
