version: "3.9"

services:
  api:
    build: .
    container_name: ougc_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: ougc_db
    environment:
      POSTGRES_USER: ougc
      POSTGRES_PASSWORD: ougc
      POSTGRES_DB: ougreencampus
